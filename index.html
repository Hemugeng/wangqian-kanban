    <meta charset="UTF-8">

    <title>重点项目网签跟进看板</title>
            <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --border-color: #475569;
            --fz-edge: rgba(255,255,255,0.65);   /* 冻结区边界亮线（首/末冻结列右缘） */
            --freeze-total: 880px;              /* 冻结区总宽，供项目分界横向亮线铺满 */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        .tab-btn:not(.active):hover {
            background: var(--bg-card);
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        /* 关键：周度表强制固定布局，冻结列宽/周列宽均显式给定，避免浏览器自适应覆盖导致 sticky left 偏移、末列随滚动微移 */
        #weeklyTable { table-layout: fixed; }
        
        th {
            background: var(--bg-card);
            padding: 0.75rem 0.5rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: 0 1px 0 0 var(--bg-card);   /* 表头底缘不透光帘：盖表头/表体亚像素缝，竖向滚动时合计行半透明蓝底不穿透（与冻结列右帘同法） */
        }
        
        td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            border-right: 1px solid rgba(255,255,255,0.12);
            font-size: 0.875rem;
        }

        /* 冻结列遮罩（竖向无缝 + 横向行界清晰，2026-09-20 修正）：
           - 竖向（列间）亚像素缝隙位于单元格右缘之外：box-shadow 在表格单元格上下文不绘制、普通右边框无法外扩；
             改用语义化 ::after 右缘外扩 2px 不透明条（取单元格自身底色 --fz-bg）覆盖，且不压行内文字。
           - 横向（行界）分界：恢复为可见底边色（与周度区一致），因 ::after 仅作用于右缘、不再覆盖底边。
           - 末列保留 border-right:3px 实边框 + 10px box-shadow 遮罩帘。 */
        td[style*="--frozen:1"], th[style*="--frozen:1"] {
            border-bottom-color: rgba(255,255,255,0.16);   /* 行与行分界清晰，与周度区风格一致 */
            border-right-color: var(--fz-bg, var(--bg-card));
        }
        th[style*="--frozen:1"] {
            border-bottom-color: var(--border-color);       /* 表头与表体之间分隔更强 */
        }
        td[style*="--frozen:1"]::after, th[style*="--frozen:1"]::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: 100%;
            width: 2px;
            background: var(--fz-bg, var(--bg-card));
            pointer-events: none;
        }
        /* 冻结区边界亮线：首列(项目)与末列(整盘网签进度)右缘亮色，清晰区隔冻结/滚动区；
           ::after 让出 2px 亮边框、在其外侧仍以底色盖缝，不透光效果不受影响 */
        td[style*="--freeze-first:1"]::after, th[style*="--freeze-first:1"]::after,
        td[style*="--freeze-last:1"]::after,  th[style*="--freeze-last:1"]::after {
            left: calc(100% + 2px);
            width: 5px;
            /* 2px 亮线(绘于内容之上，进度条等内容不会遮挡) + 3px 底色盖缝，不透光不受影响 */
            background: linear-gradient(to right, var(--fz-edge, rgba(255,255,255,0.65)) 0 2px, var(--fz-bg, var(--bg-card)) 2px 5px);
        }
        /* 项目分界横向亮线：每个项目首行(首个项目除外)在冻结区顶部铺一条与边界亮线同色同法的亮线，
           提升项目间视觉区分度；挂在下一项目首行的项目列(最高 z-index:25、且晚于上一项目出现)上，
           故压在上一项目之上无遮挡。2px 亮线(绘于内容之上) + 3px 底色盖缝，横向铺满冻结区总宽。 */
        /* 项目分界横向亮线（贯穿冻结区+周度区全宽）：挂在下一项目首行(非首个)的项目列 ::before 上，
           top:0 即落在与上一项目的分界；width 取 --proj-line-w（JS 计算的整表内容宽：冻结列宽和+周列数×周宽），
           故一条 ::before 同时覆盖冻结区与周度区，左右滚动时仍恒为满宽横线（横向线对横向滚动无感）。
           z-index:2 压在首列竖向 ::after 之上，交界处无暗缺口。 */
        td[style*="--proj-start:1"]::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: var(--proj-line-w, var(--freeze-total, 880px));
            height: 5px;
            background: linear-gradient(to bottom, var(--fz-edge, rgba(255,255,255,0.65)) 0 2px, var(--fz-bg, var(--bg-card)) 2px 5px);
            pointer-events: none;
            z-index: 2;   /* 压在首列竖向边界 ::after(无 z-index) 之上，避免交界处出现暗色盖缝缺口 */
        }
        
        tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-high { background: var(--accent-green); color: white; }
        .badge-medium { background: var(--accent-yellow); color: black; }
        .badge-low { background: var(--accent-red); color: white; }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }
        
        .table-container {
            max-height: 70vh;
            overflow-y: auto;
            /* 容器底色与冻结列一致：冻结列间偶发的亚像素缝隙会透出容器底色，使其同色即消除视觉缝隙 */
            background: var(--bg-card);
        }
        
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        .refresh-btn {
            background: var(--accent-blue);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        
        .project-header {
            background: var(--bg-card);
            font-weight: 600;
        }
        
        .merged-cell {
            vertical-align: middle;
            text-align: center;
            background: rgba(59, 130, 246, 0.08);
            font-weight: 600;
            border-right: 2px solid var(--border-color);
            white-space: pre-line;
        }
        

        .filter-th {
            vertical-align: top;
        }
        
        .th-filter {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 3px 4px;
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
        }
        
        .th-filter:hover {
            border-color: var(--accent-blue);
        }
        
        .project-row {
            background: rgba(59, 130, 246, 0.05);
        }
        
        .sub-total {
            background: rgba(234, 179, 8, 0.1);
            font-style: italic;
        }
        
        /* 合计行高亮：与各分面积段明细行区分（背景必须不透明，否则横向滚动时底层周度数据会穿透固定列） */
        tr.summary-row > td {
            background: #1e3a5f !important;
            --fz-bg: #1e3a5f;
        }
        tr.summary-row > td.merged-cell {
            background: #2a4f80 !important;
            --fz-bg: #2a4f80;
            color: #bfdbfe !important;
            font-weight: 700 !important;
        }
        tr.summary-row > td.summary-cell {
            border-left: 3px solid #3b82f6 !important;
        }
        
        .number-cell {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        
        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .week-cell {
            min-width: 60px;
            text-align: center;
        }
        /* 前一周列高亮：突出上一周数据，便于查看最新环比 */
        .week-cell.week-prev {
            background: #fff3cd;
            box-shadow: inset 3px 0 0 #f0a500, inset -3px 0 0 #f0a500;
        }
        /* 高亮列内：正数沿用正常列的绿色(.positive)；仅非正数(0/-)用深琥珀色保证浅底可读 */
        .week-cell.week-prev:not(.positive) { color: #7a4f01; }
        /* 高亮列合计行：底色仍保持合计行深蓝(#1e3a5f)，文字改白色与正常列合计行一致；深琥珀在深蓝底上过度突出故转白 */
        tr.summary-row > td.week-cell.week-prev:not(.positive) { color: #ffffff; }
        .week-header.week-prev {
            background: #ffe08a;
            color: #6b4400;
        }
        .week-header.week-prev .week-date { color: #6b4400; font-weight: 700; }
        
        .week-header {
            text-align: center;
            vertical-align: middle;
            white-space: normal;
            min-width: 46px;
            padding: 4px 2px;
            line-height: 1.15;
        }

        .week-label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--accent-blue);
        }

        .week-date {
            display: block;
            font-size: 0.58rem;
            color: var(--text-secondary);
            white-space: nowrap;
            margin-top: 2px;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-[1800px] mx-auto p-6">
        <!-- Header -->

        function _prevWeekRange() {

        // 刷新数据：先渲染本地快照保证有数据，再尝试服务器最新数据
        async function refreshData() {
            // 1. 立即用嵌入快照渲染，确保页面始终有数据（兼容 file:// 离线打开 / 服务器未启动）
            rawWeekly = EMBEDDED_DATA.weekly;
            rawOverview = EMBEDDED_DATA.overview;
            colDistrict = ''; colProject = '';
            applyFilterAndRender();
            document.getElementById('updateTime').textContent = 
                '数据更新时间：' + new Date().toLocaleString('zh-CN') + '（本地快照，正在尝试连接服务器...）';

            // 2. 尝试加载外部 data.json（公网部署时为最新数据；file:// 离线打开会被 CORS 拦截，自动回落内联快照）
            try {
                const response = await fetch('data.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                rawWeekly   = data.weekly   || [];
                rawOverview = data.overview || [];
                colDistrict = ''; colProject = '';
                document.getElementById('updateTime').textContent =
                    '数据更新时间：' + new Date().toLocaleString('zh-CN') + '（data.json）';
                applyFilterAndRender();
                await applyRuntimeOverrides();
                showNotification('已加载最新 data.json');
            } catch (error) {
                document.getElementById('updateTime').textContent =
                    '数据更新时间：' + new Date().toLocaleString('zh-CN') + '（本地快照，非最新）';
                showNotification('外部数据加载失败，当前显示本地内嵌快照', 'error');
            }
        }


        // 顶部数据透视卡片：仅对"合计"行加总，多业态项目（如保利天珺/望天际）不重复计算
        // 卡片内文字自适应：单行显示 + 字号随卡片宽度缩放（红框明细行）
        function fitCardLines(container) {
            if (!container) return;
            container.querySelectorAll('.price-line, .sub-line').forEach(div => {
                const maxFont = 14, minFont = 8;
                div.style.whiteSpace = 'nowrap';
                div.style.fontSize = maxFont + 'px';
                void div.offsetWidth; // 强制 reflow 后测量
                if (div.scrollWidth > div.clientWidth + 0.5) {
                    let fs = Math.floor(maxFont * div.clientWidth / div.scrollWidth * 0.97);
                    if (fs < minFont) fs = minFont;
                    div.style.fontSize = fs + 'px';
                }
            });
        }

        // 窗口尺寸变化时重算（防抖），保持单行自适应
        let _fitTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(_fitTimer);
            _fitTimer = setTimeout(() => fitCardLines(document.getElementById('statsCards')), 150);
        });

        function updateStats() {
            // 单项目筛选时，取该项目行集合（优先合计行，无合计行如单业态项目则取全部明细行），用于直接展示该项目的套数/价格/去化率
            const singleRows = colProject
                ? (() => {
                    const rows = weeklyData.filter(d => (d.项目 || '').split('\n')[0] === colProject);
                    const summed = rows.filter(d => (d.业态 || '').includes('合计'));
                    return summed.length ? summed : rows;
                })()
                : null;

            // 套数/供应/网签/存量/去化率：单项目取该项目行（与表格展示一致）；多项目/全部取 overview 合计行（避免重复计数）
            const aggSource = singleRows
                ? singleRows.map(r => ({
                    整盘套数: r.整盘套数,
                    供应套数: r.供应套数,
                    网签套数: r.整体网签套数,
                    整盘存量: (Number(r.整盘套数) || 0) - (Number(r.整体网签套数) || 0)
                  }))
                : overviewData.filter(d => (d.业态 || '').includes('合计')).map(r => ({
                    整盘套数: r.整盘套数,
                    供应套数: r.供应套数,
                    网签套数: r.网签套数,
                    整盘存量: r.整盘存量
                  }));
            const agg = aggSource.reduce((acc, d) => {
                acc.totalUnits  += Number(d.整盘套数) || 0;
                acc.totalSupply += Number(d.供应套数) || 0;
                acc.totalSigned += Number(d.网签套数) || 0;
                acc.totalStock  += Number(d.整盘存量) || 0;
                return acc;
            }, { totalUnits: 0, totalSupply: 0, totalSigned: 0, totalStock: 0 });

            // 整盘广义存量（万方）：该字段仅存在于 overview 表（weekly 表无），故始终从 overview 合计行聚合。
            // 单项目优先取其合计行；无合计行的单业态项目退而取全部明细行。单位：万平方米。
            const broadStockRows = colProject
                ? (() => {
                    const proj = overviewData.filter(d => (d.项目 || '').split('\n')[0] === colProject);
                    const summed = proj.filter(d => (d.业态 || '').includes('合计'));
                    return summed.length ? summed : proj;
                  })()
                : overviewData.filter(d => (d.业态 || '').includes('合计'));
            const totalBroadStock = broadStockRows.reduce((s, r) => s + (Number(r.整盘广义存量万方) || 0), 0);

            const avgConversion = agg.totalSupply > 0 ? agg.totalSigned / agg.totalSupply : 0;
            // 整盘网签进度（整盘口径）：整体网签套数 / 整盘套数，聚合后相除，逻辑同已推网签进度
            const overallProgress = agg.totalUnits > 0 ? agg.totalSigned / agg.totalUnits : 0;

            // 上周网签数：自动识别"真实上一周"——取结束日期早于今天、且最接近今天（最近一个已结束完整周）的周列，
            // 而非表格最后一列（避免指向未来空数据周如 W52）。单项目取该项目行，多项目/全部取"合计"行（避免重复）
            const weekKeys = weeklyData.length > 0
                ? Object.keys(weeklyData[0]).filter(k => k.includes('周')) : [];
            const _now = new Date();
            const _today = _now.getFullYear() + '-' + String(_now.getMonth() + 1).padStart(2, '0') + '-' + String(_now.getDate()).padStart(2, '0');
            let latestWeek = '', latestDate = '';
            weekKeys.forEach(k => {
                const m = k.match(/至(\d{4}-\d{2}-\d{2})/);
                const d = m ? m[1] : '';
                // 仅计入已结束的周（结束日期 < 今天），取结束日期最晚者 = 最近一个完整周
                if (d && d < _today && d > latestDate) { latestDate = d; latestWeek = k; }
            });
            const lastWeekRows = singleRows
                ? singleRows
                : weeklyData.filter(d => (d.业态 || '').includes('合计'));
            const lastWeekSigned = lastWeekRows.reduce((s, d) => s + (Number(d[latestWeek]) || 0), 0);
            // 周次与日期范围（副标题，体现"自动识别日期"）
            const wkNum = (latestWeek.match(/第(\d+)周/) || [])[1] || '';
            const dm = latestWeek.match(/(\d{4}-\d{2}-\d{2})至(\d{4}-\d{2}-\d{2})/);
            const weekRange = dm ? dm[1].slice(5) + '~' + dm[2].slice(5) : '';

            // 整盘网签均价：单项目筛选时按业态分组（网签套数加权）分行展示各业态价格；
            // 多项目/全部时按网签套数加权汇总为单一"综合"均价，不展开各业态
            const priceRows = singleRows
                ? singleRows
                : weeklyData.filter(d => (d.业态 || '').includes('合计'));
            const priceAgg = {};
            priceRows.forEach(d => {
                let t = (d.业态 || '').replace('合计', '').trim();
                if (!t) t = '综合';
                const p = Number(d.网签均价) || 0;
                const w = Number(d.整体网签套数) || 0;
                if (!priceAgg[t]) priceAgg[t] = { sw: 0, w: 0 };
                priceAgg[t].sw += p * w;
                priceAgg[t].w += w;
            });
            const TYPE_ORDER = ['高层', '洋房', '顶跃', '叠排', '综合'];
            let priceLines;
            if (colProject) {
                // 单项目：各业态分行展示
                priceLines = Object.keys(priceAgg).sort((a, b) => {
                    const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b);
                    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
                }).map(t => {
                    const o = priceAgg[t];
                    const avg = o.w > 0 ? Math.round(o.sw / o.w) : 0;
                    return t + ' ' + formatNumber(avg);
                });
            } else {
                // 全部/多项目：未筛选项目时整盘网签均价保持空白（不展示任何价格）
                priceLines = [];
            }

            const cards = [
                { label: '整盘总套数',   value: formatNumber(agg.totalUnits),  color: 'blue' },
                { label: '供应套数',     value: formatNumber(agg.totalSupply), color: 'cyan' },
                { label: '网签套数',     value: formatNumber(agg.totalSigned), color: 'green' },
                { label: '整盘网签均价', priceLines: priceLines,             color: 'indigo' },
                { label: '已推网签进度', value: formatPercent(avgConversion),  color: 'emerald' },
                { label: '整盘网签进度', value: formatPercent(overallProgress), color: 'teal' },
                { label: '整盘广义存量', value: colProject ? formatNumber(agg.totalStock) + ' 套' : '', color: 'orange' },
                { label: '上周网签数',   value: formatNumber(lastWeekSigned),  color: 'purple', sub: wkNum ? 'W' + wkNum + ' ' + weekRange : '' }
            ];

            const colorMap = {
                blue:    { bg: 'rgba(59,130,246,0.15)',  border: '#3b82f6', text: '#93c5fd' },
                cyan:    { bg: 'rgba(34,211,238,0.15)',  border: '#22d3ee', text: '#67e8f9' },
                green:   { bg: 'rgba(34,197,94,0.15)',   border: '#22c55e', text: '#86efac' },
                emerald: { bg: 'rgba(16,185,129,0.15)',  border: '#10b981', text: '#6ee7b7' },
                teal:    { bg: 'rgba(20,184,166,0.15)',  border: '#14b8a6', text: '#5eead4' },
                orange:  { bg: 'rgba(249,115,22,0.15)',  border: '#f97316', text: '#fdba74' },
                purple:  { bg: 'rgba(168,85,247,0.15)',  border: '#a855f7', text: '#d8b4fe' },
                indigo:  { bg: 'rgba(99,102,241,0.15)',  border: '#6366f1', text: '#a5b4fc' }
            };

            const html = cards.map(c => {
                const col = colorMap[c.color];
                const body = c.priceLines
                    ? `<div class="text-sm font-semibold leading-snug mt-1" style="color:${col.text};">` +
                      c.priceLines.map(l => `<div class="price-line" style="white-space:nowrap;">${l} <span style="font-size:0.72em;font-weight:400;color:#94a3b8;">元/㎡</span></div>`).join('') +
                      `</div>`
                    : `<div class="text-2xl font-bold" style="color:${col.text};">${c.value}</div>`;
                return `
                    <div class="stat-card card p-4 rounded-xl min-w-0" style="border-left:4px solid ${col.border}; background:${col.bg};">
                        <div class="text-xs text-slate-200 mb-1 truncate font-bold">${c.label}</div>
                        ${c.sub ? `<div class="sub-line mb-1" style="font-weight:600;color:#94a3b8;white-space:nowrap;">${c.sub}</div>` : ''}
                        ${body}
                    </div>
                `;
            }).join('');
            document.getElementById('statsCards').innerHTML = html;
            requestAnimationFrame(() => fitCardLines(document.getElementById('statsCards')));
        }


        // 更新周度表格（板块/项目/业态列使用 rowspan 真正合并单元格）
        function updateWeeklyTable() {
            const header = document.getElementById('weeklyHeader');
            const tbody = document.getElementById('weeklyBody');

            // 冻结列配置：横向滚动时左侧关键列固定（类 Excel 冻结窗格）；固定宽度保证 sticky left 精确对齐
            const FREEZE_W = [150, 90, 80, 95, 95, 95, 105, 85, 85];
            const WEEK_W = 84; // 周度列固定宽度（table-layout:fixed 下须显式给定，否则自适应覆盖冻结列宽致 sticky 偏移）
            const FREEZE_LEFT = (() => { const a = [0]; for (let i = 1; i < FREEZE_W.length; i++) a.push(a[i - 1] + FREEZE_W[i - 1]); return a; })();
            const freezeStyle = (i, extra = '') => {
            const isLast = i === FREEZE_W.length - 1;
            const isFirst = i === 0;
            return `position:sticky; --frozen:1; left:${FREEZE_LEFT[i]}px; width:${FREEZE_W[i]}px; min-width:${FREEZE_W[i]}px; max-width:${FREEZE_W[i]}px; z-index:${i === 0 ? 25 : 20}; box-shadow: inset -1px 0 0 var(--fz-bg, var(--bg-card))${isLast ? ', 10px 0 0 0 var(--fz-bg, var(--bg-card))' : ', 5px 0 0 0 var(--fz-bg, var(--bg-card))'}; text-align:center;${isFirst ? ' border-right:2px solid transparent; --freeze-first:1;' : ''}${isLast ? ' border-right:2px solid transparent; --freeze-last:1;' : ''} ${extra}`;
            };

            // 生成表头
            const weekColumns = weeklyData.length > 0
                ? Object.keys(weeklyData[0]).filter(k => k.includes('周'))
                : [];
            const PREV_WEEK = _prevWeekRange();   // 上一周日期区间，用于列高亮

            let headerHtml = `
                <tr>
                    <th class="filter-th" style="${freezeStyle(0, 'top:0; z-index:30; white-space:nowrap;')}">项目<select id="weeklyProjectFilter" class="th-filter"></select></th>
                    <th style="${freezeStyle(1, 'top:0; z-index:30; white-space:nowrap;')}">业态</th>
                    <th class="number-cell" style="${freezeStyle(2, 'top:0; z-index:30; ')}">面积段</th>
                    <th class="number-cell" style="${freezeStyle(3, 'top:0; z-index:30; ')}">整盘套数</th>
                    <th class="number-cell" style="${freezeStyle(4, 'top:0; z-index:30; ')}">供应套数</th>
                    <th class="number-cell" style="${freezeStyle(5, 'top:0; z-index:30; ')}">整体网签</th>
                    <th class="number-cell" style="${freezeStyle(6, 'top:0; z-index:30; ')}">网签单价</th>
                    <th class="number-cell" style="${freezeStyle(7, 'top:0; z-index:30; ')}">已推网签进度</th>
                    <th class="number-cell" style="${freezeStyle(8, 'top:0; z-index:30; ')}">整盘网签进度</th>
                    ${weekColumns.map(w => {
                        const m = w.match(/第(\d+)周/);
                        const wkNum = m ? m[1] : '';
                        const dm = w.match(/(\d{4}-\d{2}-\d{2})至(\d{4}-\d{2}-\d{2})/);
                        let dateRange = '';
                        if (dm) dateRange = dm[1].slice(5) + '~' + dm[2].slice(5);
                        const rg = _weekKeyRange(w);
                        const isPrev = rg && rg.start === PREV_WEEK.start && rg.end === PREV_WEEK.end;
                        return `<th class="week-cell week-header${isPrev ? ' week-prev' : ''}" style="width:${WEEK_W}px;" title="${w.replace(/\n/g, ' ')}"><span class="week-label">${isPrev ? '上周W' : 'W'}${wkNum}</span><span class="week-date">${dateRange}</span></th>`;
                    }).join('')}
                </tr>
            `;
            header.innerHTML = headerHtml;

            // 板块/项目/业态采用 rowspan 合并（同表头逻辑）
            const n = weeklyData.length;
            const prevProjectKey = (r) => (r.项目 || '').split('\n')[0];
            // 第一遍：有效业态数组（空业态向上继承同项目）
            const effectivePT = new Array(n).fill('');
            for (let i = 0; i < n; i++) {
                const row = weeklyData[i];
                const projectKey = prevProjectKey(row);
                const productType = (row.业态 || '').trim();
                if (productType === '' && i > 0 && projectKey === prevProjectKey(weeklyData[i - 1])) {
                    effectivePT[i] = effectivePT[i - 1];
                } else {
                    effectivePT[i] = productType;
                }
            }
            // 第二遍：板块/项目/业态各自的 rowspan（此时 effectivePT 已完整，可安全向前引用）

            const projectSpan = new Array(n).fill(0);
            const productTypeSpan = new Array(n).fill(0);
            for (let i = 0; i < n; i++) {
                const row = weeklyData[i];
                const projectKey = prevProjectKey(row);
                const eff = effectivePT[i];

                // 项目连续数
                if (i === 0 || projectKey !== prevProjectKey(weeklyData[i - 1])) {
                    let span = 1;
                    while (i + span < n && prevProjectKey(weeklyData[i + span]) === projectKey) span++;
                    projectSpan[i] = span;
                }
                // 业态连续数（基于有效业态，仅在相同项目下合并，空值向上并入上一同类态）
                if (i === 0 || projectKey !== prevProjectKey(weeklyData[i - 1]) || eff !== effectivePT[i - 1]) {
                    let span = 1;
                    while (i + span < n) {
                        const next = weeklyData[i + span];
                        if (prevProjectKey(next) !== projectKey) break;
                        if (effectivePT[i + span] !== eff) break;
                        span++;
                    }
                    productTypeSpan[i] = span;
                }
            }

            // 项目分界横线满宽 = 冻结列宽之和 + 周列数×周宽（table-layout:fixed 下整表内容宽）
            const projLineW = FREEZE_W.reduce((a, b) => a + b, 0) + weekColumns.length * WEEK_W;

            let html = '';
            weeklyData.forEach((row, i) => {
                const projectFull = row.项目 || '';
                const conversionRate = Number(row.已推网签进度) || Number(row.入市部分去化率) || Number(row.入市部分网签率) || 0;
                const badgeClass = conversionRate >= 0.7 ? 'badge-high' :
                                   conversionRate >= 0.4 ? 'badge-medium' : 'badge-low';
                // 整盘网签进度（整盘口径：整体网签/整盘套数），展示逻辑同已推网签进度
                const overallRate = Number(row.整盘网签进度) || 0;
                const badgeClass2 = overallRate >= 0.7 ? 'badge-high' :
                                    overallRate >= 0.4 ? 'badge-medium' : 'badge-low';

                // 合计行特殊样式标记
                const isSummaryRow = (row.业态 || '').includes('合计');
                const summaryClass = isSummaryRow ? 'summary-row' : '';
                const summaryStyle = isSummaryRow ? 'background:rgba(59,130,246,0.15); border-left:3px solid #3b82f6; ' : '';


                const projectTd = projectSpan[i] > 0
                    ? `<td rowspan="${projectSpan[i]}" class="merged-cell" style="${freezeStyle(0, 'background:var(--bg-card) !important; ')}${i > 0 ? ' --proj-start:1;' : ''} --proj-line-w:${projLineW}px;">${projectFull}</td>`
                    : '';
                const productTypeTd = productTypeSpan[i] > 0
                    ? `<td rowspan="${productTypeSpan[i]}" class="merged-cell summary-cell" style="${freezeStyle(1, 'background:var(--bg-card); ')}${isSummaryRow ? 'font-weight:600;color:#60a5fa;' : ''}">${row.业态 || ''}</td>`
                    : '';

                html += `
                    <tr class="${summaryClass}" style="${summaryStyle}">
                        ${projectTd}
                        ${productTypeTd}
                        <td class="number-cell" style="${freezeStyle(2, 'background:var(--bg-card); ')}">${formatNumber(row.面积段)}</td>
                        <td class="number-cell" style="${freezeStyle(3, 'background:var(--bg-card); ')}">${formatNumber(row.整盘套数)}</td>
                        <td class="number-cell" style="${freezeStyle(4, 'background:var(--bg-card); ')}">${formatNumber(row.供应套数)}</td>
                        <td class="number-cell" style="${freezeStyle(5, 'background:var(--bg-card); ')}">${formatNumber(row.整体网签套数)}</td>
                        <td class="number-cell" style="${freezeStyle(6, 'background:var(--bg-card); ')}">${formatNumber(row.网签均价)}</td>
                        <td class="number-cell" style="${freezeStyle(7, 'background:var(--bg-card); ')}">
                            <span class="badge ${badgeClass}">${formatPercent(conversionRate)}</span>
                        </td>
                        <td class="number-cell" style="${freezeStyle(8, 'background:var(--bg-card); ')}">
                            <span class="badge ${badgeClass2}">${formatPercent(overallRate)}</span>
                        </td>
                        ${weekColumns.map(w => {
                            const raw = row[w];
                            const isNull = (raw === null || raw === undefined);
                            const val = isNull ? 0 : Number(raw);
                            const cellClass = (val > 0) ? 'positive font-bold' : '';
                            const display = isNull ? '-' : (val > 0 ? val : '0');
                            const rg = _weekKeyRange(w);
                            const isPrev = rg && rg.start === PREV_WEEK.start && rg.end === PREV_WEEK.end;
                            return `<td class="number-cell week-cell ${cellClass}${isPrev ? ' week-prev' : ''}" style="width:${WEEK_W}px;">${display}</td>`;
                        }).join('')}
                    </tr>
                `;
            });

            tbody.innerHTML = html;

            // 固定布局下显式锁定表格总宽 = 冻结列宽之和 + 周列数×周宽，确保 sticky left 偏移与实渲染宽精确一致，杜绝末列随滚动微移
            const totalW = FREEZE_W.reduce((a, b) => a + b, 0) + (weekColumns ? weekColumns.length : 0) * WEEK_W;
            const tbl = document.getElementById('weeklyTable');
            if (tbl) tbl.style.width = totalW + 'px';
            requestAnimationFrame(scrollPrevToRight);
        }


        // 打开看板时自动将"上一周"高亮列滚动至屏幕最右；用户手动滚动后停止自动跟随，窗口尺寸变化(resize)后恢复跟随
        let _autoFollowPrev = true;
        let _progScroll = false;
        function scrollPrevToRight() {
            if (!_autoFollowPrev) return;
            const container = document.querySelector('.table-container');
            const prevTh = document.querySelector('#weeklyHeader th.week-prev');
            if (!container || !prevTh) return;
            const cLeft = container.getBoundingClientRect().left;
            const pLeftDoc = prevTh.getBoundingClientRect().left - cLeft + container.scrollLeft;
            const target = pLeftDoc + prevTh.offsetWidth - container.clientWidth;
            _progScroll = true;
            container.scrollLeft = Math.max(0, target);
        }
        (function bindPrevFollow() {
            const container = document.querySelector('.table-container');
            if (!container) return;
            container.addEventListener('scroll', () => {
                if (_progScroll) { _progScroll = false; return; }
                _autoFollowPrev = false;
            });
            let rt;
            window.addEventListener('resize', () => {
                clearTimeout(rt);
                rt = setTimeout(() => { _autoFollowPrev = true; scrollPrevToRight(); }, 200);
            });
        })();

        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('weeklyTab').classList.add('hidden');
            
            document.getElementById(tab + 'Tab').classList.remove('hidden');
            
            // 重新调整图表大小
            setTimeout(() => {
                Object.values(charts).forEach(chart => chart.resize());
            }, 100);
        }

        // 按当前列筛选条件过滤并统一渲染所有视图
        function applyFilterAndRender() {
            let filteredWeekly = rawWeekly.slice();
            if (colDistrict) filteredWeekly = filteredWeekly.filter(d => d.板块 === colDistrict);
            if (colProject) filteredWeekly = filteredWeekly.filter(d => (d.项目 || '').split('\n')[0] === colProject);
            weeklyData = filteredWeekly.filter(d => !((d.板块 || '').includes('未出规划')));

            // 总览卡片数据：按当前筛选条件联动过滤（板块/项目），与周度表保持一致；并去除无效行
            let filteredOverview = rawOverview.slice();
            if (colDistrict) filteredOverview = filteredOverview.filter(d => d.板块 === colDistrict);
            if (colProject) filteredOverview = filteredOverview.filter(d => (d.项目 || '').split('\n')[0] === colProject);
            overviewData = filteredOverview.filter(d => !((d.板块 || '').includes('未出规划')));

            updateWeeklyTable();
            updateStats();
            populateColumnFilters();
        }

        // 填充表头板块/项目筛选下拉（周度表）
        function populateColumnFilters() {
            const projects = [...new Set(rawWeekly.filter(d => d.项目).map(d => (d.项目 || '').split('\n')[0]))];
            const fillProject = (id) => {
                const sel = document.getElementById(id);
                if (!sel) return null;
                sel.innerHTML = '<option value="">全部项目</option>' + 
                    projects.map(d => `<option value="${d}">${d}</option>`).join('');
                sel.value = colProject || '';
                return sel;
            };
            const selWP = fillProject('weeklyProjectFilter');
            if (selWP) selWP.onchange = () => { colProject = selWP.value; applyFilterAndRender(); };
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-600' : 'bg-red-600'
            } text-white animate-in`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // ===== 网页端上传更新（无后端：浏览器解析 Excel → 直写 GitHub data.json）=====
        function toggleUpload() {
            const p = document.getElementById('uploadPanel');
            p.style.display = p.style.display === 'none' ? 'flex' : 'none';
        }

        // 懒加载 SheetJS（仅首次上传时下载，初始加载不占用带宽）
        let _sheetJSPromise = null;
        function ensureSheetJS() {
            if (typeof XLSX !== 'undefined') return Promise.resolve();
            if (!_sheetJSPromise) {
                _sheetJSPromise = new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'sheetjs.mini.min.js';
                    s.onload = () => resolve();
                    s.onerror = () => reject(new Error('SheetJS 加载失败（请检查网络或 sheetjs.mini.min.js 是否存在）'));
                    document.head.appendChild(s);
                });
            }
            return _sheetJSPromise;
        }

        // 把数值型字符串转数字，空值转 null
        function _toNum(v) {
            if (v === null || v === undefined || v === '') return null;
            if (typeof v === 'number') return v;
            const s = String(v).trim();
            if (s === '') return null;
            // 公式（含跨工作簿引用 =[1]...!H3）：浏览器端 SheetJS 无法计算，按缺失处理
            // （Excel 已算出的同表公式如 =SUM()/=H2/G2 会带缓存值，此处不会命中）
            if (s.charAt(0) === '=') return null;
            // 兼容百分比文本（如 "94%"）→ 0.94：Excel 里习惯填 94%，上传时归一化为 0~1 小数
            if (/%$/.test(s)) {
                const pct = parseFloat(s.replace('%', ''));
                if (!isNaN(pct)) return pct / 100;
            }
            if (!isNaN(Number(s))) return Number(s);
            return s;
        }

        // 单个 sheet → 对象数组（按表头）；周列头空格归一化为换行（与既有数据风格一致）
        function _sheetToObjects(ws) {
            // 裁剪到首行有表头的实际列范围（0824 模板维度为 A1:XFD36，多出的上万空列会产生无意义空键并拖慢解析）
            if (ws && ws['!ref']) {
                try {
                    const range = XLSX.utils.decode_range(ws['!ref']);
                    let lastCol = range.s.c;
                    for (let c = range.e.c; c >= range.s.c; c--) {
                        const cell = ws[XLSX.utils.encode_cell({ r: range.s.r, c: c })];
                        if (cell && cell.v != null && String(cell.v).trim() !== '') { lastCol = c; break; }
                    }
                    range.e.c = lastCol;
                    ws['!ref'] = XLSX.utils.encode_range(range);
                } catch (e) { /* 忽略，按原范围解析 */ }
            }
            const raw = XLSX.utils.sheet_to_json(ws, { defval: null, raw: false });
            const out = [];
            for (const r of raw) {
                const o = {};
                let hasProject = false;
                for (const k in r) {
                    let key = String(k).trim();
                    // 周列头归一化：兼容两种模板格式，统一输出既有的规范键 "26年第NN周\nYYYY-MM-DD至YYYY-MM-DD"
                    //  旧: "26年第17周 2026-04-20至2026-04-26"（空格分隔）
                    //  新(0824): "W17\n26-04-20至04-26"（W前缀 + 2位年 + 短日期）
                    if (/^W\d/.test(key)) {
                        const m = key.match(/^W(\d+)\s*(\d{2})-(\d{2})-(\d{2})至(\d{2})-(\d{2})/);
                        if (m) {
                            const y = '20' + m[2];   // 26 → 2026
                            key = `26年第${m[1]}周\n${y}-${m[3]}-${m[4]}至${y}-${m[5]}-${m[6]}`;
                        }
                    } else if (/^26年/.test(key) && key.includes('至')) {
                        key = key.replace(/\s+/g, '\n');
                    }
                    const v = _toNum(r[k]);
                    if (key === '项目' && v) hasProject = true;
                    o[key] = v;
                }
                if (hasProject) out.push(o);   // 跳过无项目的空行
            }
            return out;
        }

        // 组装成 { overview, weekly }
        // 新架构（0824 起）：单张「周度」表同时承载累计字段与周列，直接驱动看板。
        // overview 层由周度表累计字段派生（整体网签套数→网签套数；去化率按口径计算），渲染层零改动、版式不变。
        // 合计行周列兜底：浏览器 SheetJS 读不到 =SUM 公式的缓存结果（公式串被 _toNum 当 null 丢弃），
        // 导致合计行周列大量为 null → 渲染显示 '-'。此处用同表同项目「合计行上方连续明细块」按周求和重算，
        // 与 Excel 的 =SUM(明细块) 范围一致；仅当该块内所有明细周列都为 null 时才保留 null（确无数据）。
        function _recomputeSummaryWeekly(weekly) {
            if (!weekly.length) return;
            const weekKeys = Object.keys(weekly[0]).filter(k => k.includes('周'));
            if (!weekKeys.length) return;
            const projKey = (r) => (r.项目 || '').split('\n')[0];
            const isSum = (r) => (r.业态 || '').includes('合计');
            for (let i = 0; i < weekly.length; i++) {
                const s = weekly[i];
                if (!isSum(s)) continue;
                const pj = projKey(s);
                let group = [];
                if ((s.业态 || '').trim() === '合计') {
                    group = weekly.filter(d => d !== s && !isSum(d) && projKey(d) === pj);
                } else {
                    for (let j = i - 1; j >= 0; j--) {
                        const d = weekly[j];
                        if (projKey(d) !== pj) break;
                        if (isSum(d)) break;
                        group.push(d);
                    }
                }
                // 仅当该合计行确有可汇总的明细行时才重算；否则保留 Excel 中直接填写的合计值（如建发栖湖云庄仅含「排屋合计」一行、无明细，
                // 其周列是手工录入的真实数值，重算会误置 0）。复刻 Excel =SUM 语义：明细空单元格按 0 计，故有明细时合计恒为数值（0 或正数）。
                if (group.length > 0) {
                    for (const w of weekKeys) {
                        let sum = 0;
                        for (const d of group) {
                            const v = d[w];
                            const num = (v === null || v === undefined || isNaN(Number(v))) ? 0 : Number(v);
                            sum += num;
                        }
                        s[w] = sum;
                    }
                }
            }
        }

        function _buildDataFromWorkbook(wb) {
            const nameOf = (kw) => wb.SheetNames.find(n => n.includes(kw)) || null;
            const wkName = nameOf('周度') || wb.SheetNames[0];
            const weekly = _sheetToObjects(wb.Sheets[wkName]);
            _recomputeSummaryWeekly(weekly);   // 合计行周列按明细块重算，避免公式缓存缺失导致显示 '-'
            // 若存在「整体进度」sheet 则优先用其（向后兼容旧双 sheet 模板）；否则由周度表派生 overview
            const ovName = nameOf('整体进度');
            let overview;
            if (ovName && ovName !== wkName) {
                overview = _sheetToObjects(wb.Sheets[ovName]);
            } else {
                overview = weekly.map(r => {
                    const o = Object.assign({}, r);
                    const signed = (r.整体网签套数 != null) ? r.整体网签套数 : r.网签套数;
                    const total = r.整盘套数;
                    o.网签套数 = signed;                                                                 // 累计网签套数
                    o.已推去化率 = (r.已推网签进度 != null) ? r.已推网签进度 : null;
                    o.整盘去化率 = (total && signed != null) ? (Number(signed) / Number(total)) : null;
                    if (o.整盘广义存量万方 == null) o.整盘广义存量万方 = null;   // 仅历史快照用，卡片未渲染
                    return o;
                });
            }
            return { overview: overview, weekly: weekly };
        }

        // 调 GitHub Contents API 写回 data.json（PAT 仅存在于本次会话内存）
        async function _uploadDataJson(data, token) {
            const repo = 'Hemugeng/wangqian-kanban';
            const path = 'data.json';
            const api = `https://api.github.com/repos/${repo}/contents/${path}`;
            const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };
            let sha = null;
            try {
                const r = await fetch(api, { headers });
                if (r.ok) sha = (await r.json()).sha;
            } catch (_) { /* 首次无 sha 也可写 */ }
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
            const body = { message: 'update data.json via web upload', content: content };
            if (sha) body.sha = sha;
            const res = await fetch(api, {
                method: 'PUT',
                headers: Object.assign({ 'Content-Type': 'application/json' }, headers),
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || ('HTTP ' + res.status));
            }
            return true;
        }

        // 上传主流程
        async function handleUpload() {
            const pwd = (document.getElementById('uploadPwd').value || '').trim();
            const file = document.getElementById('uploadFile').files[0];
            const status = document.getElementById('uploadStatus');
            if (!pwd) { showNotification('请先粘贴上传令牌(PAT)', 'error'); return; }
            if (!file) { showNotification('请先选择 Excel 文件', 'error'); return; }
            status.textContent = '解析中…';
            try {
                await ensureSheetJS();
                const buf = await file.arrayBuffer();
                const wb = XLSX.read(buf, { type: 'array' });
                const data = _buildDataFromWorkbook(wb);
                if (!data.weekly.length)
                    throw new Error('模板无数据，请确认含「周度」sheet');
                // 防护：累计字段全为空（多为未"粘贴为值"的跨表公式）→ 拒绝上传，避免写坏线上 data.json
                const hasSigned = data.weekly.some(r => r.整体网签套数 != null && Number(r.整体网签套数) > 0);
                if (!hasSigned)
                    throw new Error('「整体网签套数」累计字段为空：请先在 Excel 中"复制→粘贴为值"断开公式链接后再上传');
                // 护栏①：周列键必须含"周"字（W17 等旧表头应被归一化为"26年第NN周"），否则周度表渲染会全空白
                const _sample = data.weekly.find(r => r.项目) || data.weekly[0] || {};
                const _wkKeys = Object.keys(_sample).filter(k => k.includes('周'));
                if (_wkKeys.length === 0)
                    throw new Error('未识别到任何周列：请确认周列表头为「W17」或「26年第17周」格式且含日期范围，或联系管理员');
                // 护栏②：产物体积护栏（正常应 < 1MB；若逼近说明列未裁剪，拒绝以免写出 23MB 坏文件写坏线上 data.json）
                const _payloadSize = JSON.stringify(data).length;
                if (_payloadSize > 2 * 1024 * 1024)
                    throw new Error('解析产物异常庞大（' + (_payloadSize / 1024 / 1024).toFixed(1) + 'MB），疑似列未裁剪，已拒绝上传');
                status.textContent = '上传中…';
                await _uploadDataJson(data, pwd);
                status.textContent = '成功 ✓';
                showNotification('已上传并更新看板，稍后刷新即可见');
                await refreshData();   // 重新拉取最新 data.json 渲染
            } catch (e) {
                status.textContent = '失败：' + e.message;
                showNotification('上传失败：' + e.message, 'error');
            }
        }

        // 初始加载
        refreshData();
    </script>
