    <meta charset="UTF-8">

    <title>重点项目网签跟进看板</title>
            <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --border-color: #475569;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        .tab-btn:not(.active):hover {
            background: var(--bg-card);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: var(--bg-card);
            padding: 0.75rem 0.5rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }
        
        tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-high { background: var(--accent-green); color: white; }
        .badge-medium { background: var(--accent-yellow); color: black; }
        .badge-low { background: var(--accent-red); color: white; }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease-out;
        }
        
        .table-container {
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }
        
        .table-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        .refresh-btn {
            background: var(--accent-blue);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        
        .project-header {
            background: var(--bg-card);
            font-weight: 600;
        }
        
        .merged-cell {
            vertical-align: middle;
            text-align: center;
            background: rgba(59, 130, 246, 0.08);
            font-weight: 600;
            border-right: 2px solid var(--border-color);
            white-space: pre-line;
        }
        

        .filter-th {
            vertical-align: top;
        }
        
        .th-filter {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 3px 4px;
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
        }
        
        .th-filter:hover {
            border-color: var(--accent-blue);
        }
        
        .project-row {
            background: rgba(59, 130, 246, 0.05);
        }
        
        .sub-total {
            background: rgba(234, 179, 8, 0.1);
            font-style: italic;
        }
        
        .number-cell {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        
        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .week-cell {
            min-width: 60px;
            text-align: center;
        }
        
        .week-header {
            text-align: center;
            vertical-align: middle;
            white-space: normal;
            min-width: 46px;
            padding: 4px 2px;
            line-height: 1.15;
        }

        .week-label {
            display: block;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--accent-blue);
        }

        .week-date {
            display: block;
            font-size: 0.58rem;
            color: var(--text-secondary);
            white-space: nowrap;
            margin-top: 2px;
        }
    </style>
</head>

        // 顶部数据透视卡片：仅对"合计"行加总，多业态项目（如保利天珺/望天际）不重复计算
        function updateStats() {
            // 单项目筛选时，取该项目行集合（优先合计行，无合计行如单业态项目则取全部明细行），用于直接展示该项目的套数/价格/去化率
            const singleRows = colProject
                ? (() => {
                    const rows = weeklyData.filter(d => (d.项目 || '').split('\n')[0] === colProject);
                    const summed = rows.filter(d => (d.业态 || '').includes('合计'));
                    return summed.length ? summed : rows;
                })()
                : null;

            // 套数/供应/网签/存量/去化率：单项目取该项目行（与表格展示一致）；多项目/全部取 overview 合计行（避免重复计数）
            const aggSource = singleRows
                ? singleRows.map(r => ({
                    整盘套数: r.整盘套数,
                    供应套数: r.供应套数,
                    网签套数: r.整体网签套数,
                    整盘存量: (Number(r.整盘套数) || 0) - (Number(r.整体网签套数) || 0)
                  }))
                : overviewData.filter(d => (d.业态 || '').includes('合计')).map(r => ({

                    供应套数: r.供应套数,
                    网签套数: r.网签套数,
                    整盘存量: r.整盘存量
                  }));
            const agg = aggSource.reduce((acc, d) => {
                acc.totalUnits  += Number(d.整盘套数) || 0;
                acc.totalSupply += Number(d.供应套数) || 0;
                acc.totalSigned += Number(d.网签套数) || 0;
                acc.totalStock  += Number(d.整盘存量) || 0;
                return acc;
            }, { totalUnits: 0, totalSupply: 0, totalSigned: 0, totalStock: 0 });

            const avgConversion = agg.totalSupply > 0 ? agg.totalSigned / agg.totalSupply : 0;

            // 上周网签数：自动识别最新周（结束日期最晚的周列）；单项目取该项目行，多项目/全部取"合计"行（避免重复）
            const weekKeys = weeklyData.length > 0
                ? Object.keys(weeklyData[0]).filter(k => k.includes('周')) : [];
            let latestWeek = '', latestDate = '';
            weekKeys.forEach(k => {
                const m = k.match(/至(\d{4}-\d{2}-\d{2})/);
                const d = m ? m[1] : '';
                if (d && d > latestDate) { latestDate = d; latestWeek = k; }
            });
            const lastWeekRows = singleRows
                ? singleRows
                : weeklyData.filter(d => (d.业态 || '').includes('合计'));
            const lastWeekSigned = lastWeekRows.reduce((s, d) => s + (Number(d[latestWeek]) || 0), 0);
            // 周次与日期范围（副标题，体现"自动识别日期"）
            const wkNum = (latestWeek.match(/第(\d+)周/) || [])[1] || '';
            const dm = latestWeek.match(/(\d{4}-\d{2}-\d{2})至(\d{4}-\d{2}-\d{2})/);
            const weekRange = dm ? dm[1].slice(5) + '~' + dm[2].slice(5) : '';

            // 整盘网签均价：单项目筛选时按业态分组（网签套数加权）分行展示各业态价格；
            // 多项目/全部时按网签套数加权汇总为单一"综合"均价，不展开各业态
            const priceRows = singleRows
                ? singleRows
                : weeklyData.filter(d => (d.业态 || '').includes('合计'));
            const priceAgg = {};
            priceRows.forEach(d => {
                let t = (d.业态 || '').replace('合计', '').trim();
                if (!t) t = '综合';
                const p = Number(d.网签均价) || 0;
                const w = Number(d.整体网签套数) || 0;
                if (!priceAgg[t]) priceAgg[t] = { sw: 0, w: 0 };
                priceAgg[t].sw += p * w;
                priceAgg[t].w += w;
            });
            const TYPE_ORDER = ['高层', '洋房', '顶跃', '叠排', '综合'];
            let priceLines;
            if (colProject) {
                // 单项目：各业态分行展示
                priceLines = Object.keys(priceAgg).sort((a, b) => {
                    const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b);
                    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
                }).map(t => {
                    const o = priceAgg[t];
                    const avg = o.w > 0 ? Math.round(o.sw / o.w) : 0;
                    return t + ' ' + formatNumber(avg);
                });
            } else {
                // 全部/多项目：未筛选项目时整盘网签均价保持空白（不展示任何价格）
                priceLines = [];
            }

            const cards = [
                { label: '整盘总套数',   value: formatNumber(agg.totalUnits),  color: 'blue' },
                { label: '供应套数',     value: formatNumber(agg.totalSupply), color: 'cyan' },
                { label: '网签套数',     value: formatNumber(agg.totalSigned), color: 'green' },
                { label: '整盘网签均价', priceLines: priceLines,             color: 'indigo' },
                { label: '已推网签进度', value: formatPercent(avgConversion),  color: 'emerald' },
                { label: '整盘存量(套)', value: formatNumber(agg.totalStock),  color: 'orange' },
                { label: '上周网签数',   value: formatNumber(lastWeekSigned),  color: 'purple', sub: wkNum ? 'W' + wkNum + ' ' + weekRange : '' }
            ];

            const colorMap = {
                blue:    { bg: 'rgba(59,130,246,0.15)',  border: '#3b82f6', text: '#93c5fd' },
                cyan:    { bg: 'rgba(34,211,238,0.15)',  border: '#22d3ee', text: '#67e8f9' },
                green:   { bg: 'rgba(34,197,94,0.15)',   border: '#22c55e', text: '#86efac' },
                emerald: { bg: 'rgba(16,185,129,0.15)',  border: '#10b981', text: '#6ee7b7' },
                orange:  { bg: 'rgba(249,115,22,0.15)',  border: '#f97316', text: '#fdba74' },
                purple:  { bg: 'rgba(168,85,247,0.15)',  border: '#a855f7', text: '#d8b4fe' },
                indigo:  { bg: 'rgba(99,102,241,0.15)',  border: '#6366f1', text: '#a5b4fc' }
            };

            const html = cards.map(c => {
                const col = colorMap[c.color];
                const body = c.priceLines
                    ? `<div class="text-sm font-semibold leading-snug mt-1" style="color:${col.text};">` +
                      c.priceLines.map(l => `<div>${l} <span class="text-[10px] font-normal text-slate-400">元/㎡</span></div>`).join('') +
                      `</div>`
                    : `<div class="text-2xl font-bold" style="color:${col.text};">${c.value}</div>`;
                return `
                    <div class="stat-card card p-4 rounded-xl min-w-0" style="border-left:4px solid ${col.border}; background:${col.bg};">
                        <div class="text-xs text-slate-200 mb-1 truncate font-bold">${c.label}</div>
                        ${c.sub ? `<div class="text-[10px] text-slate-400 mb-1">${c.sub}</div>` : ''}
                        ${body}
                    </div>
                `;
            }).join('');
            document.getElementById('statsCards').innerHTML = html;
        }


        // 更新周度表格（板块/项目/业态列使用 rowspan 真正合并单元格）
        function updateWeeklyTable() {
            const header = document.getElementById('weeklyHeader');
            const tbody = document.getElementById('weeklyBody');

            // 冻结列配置：横向滚动时左侧关键列固定（类 Excel 冻结窗格）；固定宽度保证 sticky left 精确对齐
            const FREEZE_W = [90, 150, 90, 80, 95, 95, 95, 105, 85];
            const FREEZE_LEFT = (() => { const a = [0]; for (let i = 1; i < FREEZE_W.length; i++) a.push(a[i - 1] + FREEZE_W[i - 1]); return a; })();
            const freezeStyle = (i, extra = '') =>
                `position:sticky; left:${FREEZE_LEFT[i]}px; width:${FREEZE_W[i]}px; min-width:${FREEZE_W[i]}px; z-index:20; ${extra}`;

            // 生成表头
            const weekColumns = weeklyData.length > 0
                ? Object.keys(weeklyData[0]).filter(k => k.includes('周'))
                : [];

            let headerHtml = `
                <tr>
                    <th class="filter-th" style="${freezeStyle(0, 'top:0; z-index:30; white-space:nowrap;')}">板块<select id="weeklyDistrictFilter" class="th-filter"></select></th>
                    <th class="filter-th" style="${freezeStyle(1, 'top:0; z-index:30; white-space:nowrap;')}">项目<select id="weeklyProjectFilter" class="th-filter"></select></th>
                    <th style="${freezeStyle(2, 'top:0; z-index:30; white-space:nowrap;')}">业态</th>
                    <th class="number-cell" style="${freezeStyle(3, 'top:0; z-index:30; ')}">面积段</th>
                    <th class="number-cell" style="${freezeStyle(4, 'top:0; z-index:30; ')}">整盘套数</th>
                    <th class="number-cell" style="${freezeStyle(5, 'top:0; z-index:30; ')}">供应套数</th>
                    <th class="number-cell" style="${freezeStyle(6, 'top:0; z-index:30; ')}">整体网签</th>
                    <th class="number-cell" style="${freezeStyle(7, 'top:0; z-index:30; ')}">网签单价</th>
                    <th class="number-cell" style="${freezeStyle(8, 'top:0; z-index:30; ')}">已推网签进度</th>
                    ${weekColumns.map(w => {
                        const m = w.match(/第(\d+)周/);
                        const wkNum = m ? m[1] : '';
                        const dm = w.match(/(\d{4}-\d{2}-\d{2})至(\d{4}-\d{2}-\d{2})/);
                        let dateRange = '';
                        if (dm) dateRange = dm[1].slice(5) + '~' + dm[2].slice(5);
                        return `<th class="week-cell week-header" title="${w.replace(/\n/g, ' ')}"><span class="week-label">W${wkNum}</span><span class="week-date">${dateRange}</span></th>`;
                    }).join('')}
                </tr>
            `;
            header.innerHTML = headerHtml;

            // 板块/项目/业态采用 rowspan 合并（同表头逻辑）
            const n = weeklyData.length;
            const prevProjectKey = (r) => (r.项目 || '').split('\n')[0];
            // 第一遍：有效业态数组（空业态向上继承同项目）
            const effectivePT = new Array(n).fill('');
            for (let i = 0; i < n; i++) {
                const row = weeklyData[i];
                const projectKey = prevProjectKey(row);
                const productType = (row.业态 || '').trim();
                if (productType === '' && i > 0 && projectKey === prevProjectKey(weeklyData[i - 1])) {
                    effectivePT[i] = effectivePT[i - 1];
                } else {
                    effectivePT[i] = productType;
                }
            }
            // 第二遍：板块/项目/业态各自的 rowspan（此时 effectivePT 已完整，可安全向前引用）
            const districtSpan = new Array(n).fill(0);
            const projectSpan = new Array(n).fill(0);
            const productTypeSpan = new Array(n).fill(0);
            for (let i = 0; i < n; i++) {
                const row = weeklyData[i];
                const projectKey = prevProjectKey(row);
                const eff = effectivePT[i];
                // 板块连续数
                if (i === 0 || row.板块 !== weeklyData[i - 1].板块) {
                    let span = 1;
                    while (i + span < n && weeklyData[i + span].板块 === row.板块) span++;
                    districtSpan[i] = span;
                }
                // 项目连续数
                if (i === 0 || projectKey !== prevProjectKey(weeklyData[i - 1])) {
                    let span = 1;
                    while (i + span < n && prevProjectKey(weeklyData[i + span]) === projectKey) span++;
                    projectSpan[i] = span;
                }
                // 业态连续数（基于有效业态，仅在相同项目下合并，空值向上并入上一同类态）
                if (i === 0 || projectKey !== prevProjectKey(weeklyData[i - 1]) || eff !== effectivePT[i - 1]) {
                    let span = 1;
                    while (i + span < n) {
                        const next = weeklyData[i + span];
                        if (prevProjectKey(next) !== projectKey) break;
                        if (effectivePT[i + span] !== eff) break;
                        span++;
                    }
                    productTypeSpan[i] = span;
                }
            }

            let html = '';
            weeklyData.forEach((row, i) => {
                const projectFull = row.项目 || '';
                const conversionRate = Number(row.入市部分去化率) || 0;
                const badgeClass = conversionRate >= 0.7 ? 'badge-high' :
                                   conversionRate >= 0.4 ? 'badge-medium' : 'badge-low';

                const districtTd = districtSpan[i] > 0
                    ? `<td rowspan="${districtSpan[i]}" class="merged-cell" style="${freezeStyle(0, 'background:var(--bg-card); ')}">${row.板块 || ''}</td>`
                    : '';
                const projectTd = projectSpan[i] > 0
                    ? `<td rowspan="${projectSpan[i]}" class="merged-cell" style="${freezeStyle(1, 'background:var(--bg-card); ')}">${projectFull}</td>`
                    : '';
                const productTypeTd = productTypeSpan[i] > 0
                    ? `<td rowspan="${productTypeSpan[i]}" class="merged-cell" style="${freezeStyle(2, 'background:var(--bg-card); ')}">${row.业态 || ''}</td>`
                    : '';

                html += `
                    <tr>
                        ${districtTd}
                        ${projectTd}
                        ${productTypeTd}
                        <td class="number-cell" style="${freezeStyle(3, 'background:var(--bg-card); ')}">${formatNumber(row.面积段)}</td>
                        <td class="number-cell" style="${freezeStyle(4, 'background:var(--bg-card); ')}">${formatNumber(row.整盘套数)}</td>
                        <td class="number-cell" style="${freezeStyle(5, 'background:var(--bg-card); ')}">${formatNumber(row.供应套数)}</td>
                        <td class="number-cell" style="${freezeStyle(6, 'background:var(--bg-card); ')}">${formatNumber(row.整体网签套数)}</td>
                        <td class="number-cell" style="${freezeStyle(7, 'background:var(--bg-card); ')}">${formatNumber(row.网签均价)}</td>
                        <td class="number-cell" style="${freezeStyle(8, 'background:var(--bg-card); ')}">
                            <span class="badge ${badgeClass}">${formatPercent(conversionRate)}</span>
                        </td>
                        ${weekColumns.map(w => {
                            const val = Number(row[w]) || 0;
                            const cellClass = val > 0 ? 'positive font-bold' : '';
                            return `<td class="number-cell week-cell ${cellClass}">${val > 0 ? val : '-'}</td>`;
                        }).join('')}
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }


        // 切换标签页
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('weeklyTab').classList.add('hidden');
            
            document.getElementById(tab + 'Tab').classList.remove('hidden');
            
            // 重新调整图表大小
            setTimeout(() => {
                Object.values(charts).forEach(chart => chart.resize());
            }, 100);
        }

        // 按当前列筛选条件过滤并统一渲染所有视图
        function applyFilterAndRender() {
            let filteredWeekly = rawWeekly.slice();
            if (colDistrict) filteredWeekly = filteredWeekly.filter(d => d.板块 === colDistrict);
            if (colProject) filteredWeekly = filteredWeekly.filter(d => (d.项目 || '').split('\n')[0] === colProject);
            weeklyData = filteredWeekly.filter(d => !((d.板块 || '').includes('未出规划')) && !((d.业态 || '').includes('叠排合计')));

            // 总览卡片数据：按当前筛选条件联动过滤（板块/项目），与周度表保持一致；并去除无效行
            let filteredOverview = rawOverview.slice();
            if (colDistrict) filteredOverview = filteredOverview.filter(d => d.板块 === colDistrict);
            if (colProject) filteredOverview = filteredOverview.filter(d => (d.项目 || '').split('\n')[0] === colProject);
            overviewData = filteredOverview.filter(d => !((d.板块 || '').includes('未出规划')) && !((d.业态 || '').includes('叠排合计')));

            updateWeeklyTable();
            updateStats();
            populateColumnFilters();
        }

        // 填充表头板块/项目筛选下拉（周度表）
        function populateColumnFilters() {
            const districts = [...new Set(rawWeekly.filter(d => d.板块).map(d => d.板块))];
            const projects = [...new Set(rawWeekly.filter(d => d.项目).map(d => (d.项目 || '').split('\n')[0]))];
            const fillDistrict = (id) => {
                const sel = document.getElementById(id);
                if (!sel) return null;
                sel.innerHTML = '<option value="">全部板块</option>' + 
                    districts.map(d => `<option value="${d}">${d}</option>`).join('');
                sel.value = colDistrict || '';
                return sel;
            };
            const fillProject = (id) => {
                const sel = document.getElementById(id);
                if (!sel) return null;
                sel.innerHTML = '<option value="">全部项目</option>' + 
                    projects.map(d => `<option value="${d}">${d}</option>`).join('');
                sel.value = colProject || '';
                return sel;
            };
            const selWD = fillDistrict('weeklyDistrictFilter');
            const selWP = fillProject('weeklyProjectFilter');
            if (selWD) selWD.onchange = () => { colDistrict = selWD.value; applyFilterAndRender(); };
            if (selWP) selWP.onchange = () => { colProject = selWP.value; applyFilterAndRender(); };
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-600' : 'bg-red-600'
            } text-white animate-in`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // 初始加载
        refreshData();
    </script>
</body>
</html>
